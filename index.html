<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chào Cậu 👋</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:linear-gradient(
        -45deg,
        #5865F2,
        #00A884,
        #00D4FF,
        #FF4ECD
    );
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
    z-index:-1;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:380px;
    max-width:90%;
    padding:35px;
    text-align:center;
    border-radius:30px;

    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.15);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.avatar{
    width:140px;
    height:140px;

    border-radius:50%;
    object-fit:cover;

    border:4px solid white;

    box-shadow:
        0 0 20px rgba(255,255,255,.5),
        0 0 40px rgba(0,212,255,.6);

    transition:.4s;
}

.avatar:hover{
    transform:scale(1.08) rotate(5deg);

    box-shadow:
        0 0 30px #00d4ff,
        0 0 60px #00d4ff;
}

h1{
    margin-top:15px;
    color:white;
}

.subtitle{
    color:white;
    opacity:.9;
    margin-top:8px;
    margin-bottom:25px;
}

.link{
    display:block;
    position:relative;
    overflow:hidden;

    text-decoration:none;
    color:white;

    margin:12px 0;
    padding:16px;

    border-radius:15px;

    font-weight:600;

    transition:.35s;
}

.link:hover{
    transform:translateY(-5px) scale(1.03);
}

.link::before{
    content:'';
    position:absolute;
    top:0;
    left:-120%;

    width:50%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );

    transition:.6s;
}

.link:hover::before{
    left:120%;
}

/* Zalo */
.zalo{
    background:#0088ff;
}
.zalo:hover{
    box-shadow:0 0 25px #0088ff;
}

/* Discord */
.discord{
    background:#5865F2;
}
.discord:hover{
    box-shadow:0 0 25px #5865F2;
}

/* TikTok */
.tiktok{
    background:linear-gradient(
        45deg,
        #25F4EE,
        #FE2C55,
        #000000
    );
}
.tiktok:hover{
    box-shadow:
        0 0 20px #25F4EE,
        0 0 30px #FE2C55;
}

.info{
    color:white;
    opacity:.8;
    margin-top:20px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">

    <img src="avatar.jpg"
         class="avatar"
         alt="Avatar">

    <h1>chào cậu 👋</h1>

    <p class="subtitle">
        nhấn thử mấy nút bên dưới đi...
    </p>

    <a
        href="https://zalo.me/0865898150"
        target="_blank"
        class="link zalo">
        📱 Zalo: 0865898150
    </a>

    <a
        href="#"
        class="link discord">
        🎮 Discord: ngonthi0216
    </a>

    <a
        href="https://www.tiktok.com/@khanhan142588"
        target="_blank"
        class="link tiktok">
        🎵 TikTok: @khanhan142588
    </a>

    <div class="info">
        © 2026 • Personal Profile
    </div>

</div>

</body>
</html>
